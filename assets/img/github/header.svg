<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.32; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes dash {
        0% { stroke-dashoffset: 420; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-dot {
        animation: pulse 2.2s ease-in-out infinite;
      }
      .cursor {
        animation: blink 1.1s step-end infinite;
      }
      .curve-anim {
        stroke-dasharray: 420;
        animation: dash 5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>

    <linearGradient id="blueArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="emeraldArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <radialGradient id="subtleGlow" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame">
      <rect width="1200" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1200" height="220" fill="url(#bg)"/>
    <rect width="1200" height="220" fill="url(#subtleGlow)"/>

    <!-- Subtle Engineering Grid -->
    <g stroke="#f0f6fc" stroke-opacity="0.05" stroke-width="1">
      <line x1="0" y1="44" x2="1200" y2="44"/>
      <line x1="0" y1="176" x2="1200" y2="176"/>
      <line x1="760" y1="0" x2="760" y2="220" stroke-opacity="0.08"/>
    </g>

    <!-- ============ LEFT: IDENTITY & CORE ROLE (x=44..720) ============ -->
    <!-- Status Bar -->
    <g transform="translate(44, 28)">
      <circle cx="6" cy="-4" r="4" fill="#10b981" class="pulse-dot"/>
      <text x="18" y="0" class="mono" font-size="11" font-weight="600" fill="#10b981" letter-spacing="0.08em">
        OPEN TO ML / DATA SCIENCE &amp; PYTHON ROLES
      </text>
      <text x="356" y="0" class="mono" font-size="11" fill="#8b949e" letter-spacing="0.06em">
        //  @radikdollar  ·  radikdollar.com
      </text>
    </g>

    <!-- Main Name -->
    <text x="44" y="102" class="sans" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.03em">
      Radion Vakhromeev
    </text>

    <!-- Role & Specialization -->
    <text x="44" y="136" class="sans" font-size="18" font-weight="500" fill="#58a6ff">
      Machine Learning &amp; Data Science
      <tspan fill="#8b949e" font-weight="400"> · Python Software Engineer</tspan>
    </text>

    <!-- Terminal Stack Line -->
    <g transform="translate(44, 198)">
      <text x="0" y="0" class="mono" font-size="12" fill="#8b949e">
        <tspan fill="#3b82f6" font-weight="700">~$</tspan> stack --core
        <tspan fill="#c9d1d9">python · pytorch · scikit-learn · pandas · numpy · sql · fastapi</tspan><tspan fill="#3b82f6" class="cursor"> ▋</tspan>
      </text>
    </g>

    <!-- ============ RIGHT: MINIMALIST ML TELEMETRY & CONVERGENCE WIDGET (x=792..1164) ============ -->
    <g transform="translate(792, 24)">
      <rect x="0" y="0" width="368" height="172" rx="10" fill="#0d1117" fill-opacity="0.9" stroke="#30363d" stroke-width="1"/>

      <!-- Widget Header -->
      <text x="18" y="24" class="mono" font-size="10.5" font-weight="600" fill="#8b949e" letter-spacing="0.06em">
        MODEL TELEMETRY // VALIDATION
      </text>
      <circle cx="306" cy="20" r="3.5" fill="#10b981" class="pulse-dot"/>
      <text x="350" y="24" text-anchor="end" class="mono" font-size="10.5" font-weight="600" fill="#10b981">
        READY
      </text>
      <line x1="0" y1="36" x2="368" y2="36" stroke="#21262d" stroke-width="1"/>

      <!-- Chart Grid Lines -->
      <g stroke="#21262d" stroke-width="1" stroke-dasharray="3 3">
        <line x1="18" y1="62" x2="350" y2="62"/>
        <line x1="18" y1="90" x2="350" y2="90"/>
        <line x1="18" y1="118" x2="350" y2="118"/>
      </g>

      <!-- Area fills under curves -->
      <path d="M 18 56 C 75 58, 115 104, 185 112 C 245 118, 295 121, 350 122 L 350 128 L 18 128 Z" fill="url(#blueArea)"/>
      <path d="M 18 120 C 75 115, 115 72, 185 62 C 245 55, 295 52, 350 51 L 350 128 L 18 128 Z" fill="url(#emeraldArea)"/>

      <!-- Loss Decay Curve (Blue) -->
      <path d="M 18 56 C 75 58, 115 104, 185 112 C 245 118, 295 121, 350 122" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" class="curve-anim"/>

      <!-- Metric / ROC-AUC Curve (Emerald) -->
      <path d="M 18 120 C 75 115, 115 72, 185 62 C 245 55, 295 52, 350 51" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" class="curve-anim"/>

      <!-- Endpoint Dots -->
      <circle cx="350" cy="51" r="3.5" fill="#10b981"/>
      <circle cx="350" cy="122" r="3.5" fill="#3b82f6"/>

      <!-- Bottom Telemetry Metrics -->
      <line x1="0" y1="136" x2="368" y2="136" stroke="#21262d" stroke-width="1"/>
      <circle cx="24" cy="154" r="3.5" fill="#10b981"/>
      <text x="34" y="158" class="mono" font-size="10.5" fill="#c9d1d9">val_auc <tspan fill="#10b981" font-weight="700">▲ 0.964</tspan></text>

      <circle cx="152" cy="154" r="3.5" fill="#3b82f6"/>
      <text x="162" y="158" class="mono" font-size="10.5" fill="#c9d1d9">val_loss <tspan fill="#58a6ff" font-weight="700">▼ 0.041</tspan></text>

      <text x="350" y="158" text-anchor="end" class="mono" font-size="10.5" fill="#8b949e">PyTorch · Sklearn</text>
    </g>

    <!-- Outer Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="13.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
  </g>
</svg>