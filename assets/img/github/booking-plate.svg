<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .display {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.025em;
      }
    </style>

    <linearGradient id="chromePlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="28%" stop-color="#282833"/>
      <stop offset="50%" stop-color="#14141b"/>
      <stop offset="76%" stop-color="#252530"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>

    <linearGradient id="metalSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="plateClip">
      <rect width="1200" height="200" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect width="1200" height="200" fill="url(#chromePlate)"/>

    <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
      <line x1="0" y1="36" x2="1200" y2="36"/>
      <line x1="0" y1="72" x2="1200" y2="72"/>
      <line x1="0" y1="108" x2="1200" y2="108"/>
      <line x1="0" y1="144" x2="1200" y2="144"/>
      <line x1="0" y1="176" x2="1200" y2="176"/>
    </g>

    <rect x="-350" y="0" width="300" height="200" fill="url(#metalSheen)" transform="skewX(-25)">
      <animate attributeName="x" values="-350;1450;-350" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- 4 Corner Machined Screws -->
    <g fill="#0c0c10" stroke="#f2f0ea" stroke-opacity="0.35" stroke-width="1.5">
      <circle cx="28" cy="28" r="7"/>
      <line x1="24" y1="28" x2="32" y2="28" stroke="#f2f0ea" stroke-opacity="0.4"/>
      <circle cx="1172" cy="28" r="7"/>
      <line x1="1168" y1="28" x2="1176" y2="28" stroke="#f2f0ea" stroke-opacity="0.4"/>
      <circle cx="28" cy="172" r="7"/>
      <line x1="24" y1="172" x2="32" y2="172" stroke="#f2f0ea" stroke-opacity="0.4"/>
      <circle cx="1172" cy="172" r="7"/>
      <line x1="1168" y1="172" x2="1176" y2="172" stroke="#f2f0ea" stroke-opacity="0.4"/>
    </g>

    <text x="64" y="52" class="mono" font-size="11" fill="#ff3b1f" font-weight="700">
      (05) BOOKING &amp; INQUIRIES // SHOWS · FEATURES · PRESS · VISUALS — REPLY 24—72H
    </text>

    <text x="64" y="112" class="display" font-size="46" fill="#f2f0ea">booking@radikdollar.com</text>

    <g transform="translate(880, 72)">
      <rect x="0" y="0" width="256" height="52" rx="26" fill="#0b0b10" stroke="#ff3b1f" stroke-opacity="0.65" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="4.5" fill="#1ed760">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="136" y="30" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f2f0ea">DIRECT MANAGEMENT ↗</text>
    </g>

    <text x="64" y="162" class="mono" font-size="10.5" fill="#f2f0ea" fill-opacity="0.52">
      RDK—PLATE—0005 · ANODIZED CHROME · ATLANTA, GA
    </text>
    <text x="1136" y="162" text-anchor="end" class="mono" font-size="10.5" fill="#f2f0ea" fill-opacity="0.68">
      IG / TIKTOK / YT: @RADIKDOLLAR
    </text>

    <rect x="1" y="1" width="1198" height="198" rx="17" fill="none" stroke="#f2f0ea" stroke-opacity="0.24" stroke-width="2"/>
  </g>
</svg>